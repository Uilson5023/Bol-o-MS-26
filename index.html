var pendingResultNums = [];

function toggleResultForm(){
  var wrap = document.getElementById('blResultForm');
  if(wrap.innerHTML){ wrap.innerHTML = ''; return; }
  pendingResultNums = state.resultado && state.resultado.numeros ? state.resultado.numeros.slice() : [];
  var html = '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px;">';
  html += '<div class="bl-row">';
  html += '<div class="bl-field" style="flex:1"><label>Concurso (opcional)</label><input class="bl-input" id="blResConcurso" type="text" value="' + (state.resultado && state.resultado.concurso ? escapeHtml(String(state.resultado.concurso)) : '') + '" placeholder="Ex: 3732" /></div>';
  html += '<div class="bl-field" style="flex:1"><label>Data (opcional)</label><input class="bl-input" id="blResData" type="date" value="' + (state.resultado && state.resultado.data ? state.resultado.data : new Date().toISOString().slice(0,10)) + '" /></div>';
  html += '</div>';
  html += '<div class="bl-field"><label>Marque as 6 dezenas sorteadas</label>';
  html += '<p class="bl-pick-count" id="blResCount">' + pendingResultNums.length + ' de 6 selecionadas</p>';
  html += '<div class="bl-pick-grid" id="blResGrid"></div></div>';
  html += '<div class="bl-error" id="blResErr"></div>';
  html += '<div class="bl-row"><button class="bl-btn" id="blSaveResultBtn" type="button">Salvar resultado</button><button class="bl-btn secondary" id="blCancelResultBtn" type="button">Cancelar</button></div>';
  html += '</div>';
  wrap.innerHTML = html;

  var grid = document.getElementById('blResGrid');
  for(var n=1;n<=MAX_NUM;n++){
    var b = document.createElement('button');
    b.type='button'; b.className='bl-pick' + (pendingResultNums.indexOf(n)>-1?' sel':''); b.textContent=n; b.dataset.n=n;
    b.addEventListener('click', function(){
      var num = parseInt(this.dataset.n);
      var idx = pendingResultNums.indexOf(num);
      if(idx>-1){ pendingResultNums.splice(idx,1); this.classList.remove('sel'); }
      else{ pendingResultNums.push(num); this.classList.add('sel'); }
      document.getElementById('blResCount').textContent = pendingResultNums.length + ' de 6 selecionadas';
    });
    grid.appendChild(b);
  }

  document.getElementById('blCancelResultBtn').addEventListener('click', function(){ wrap.innerHTML=''; });

  document.getElementById('blSaveResultBtn').addEventListener('click', function(){
    var err = document.getElementById('blResErr');
    if(pendingResultNums.length !== BET_SIZE){
      err.textContent = 'Selecione exatamente ' + BET_SIZE + ' n\u00fameros (voc\u00ea marcou ' + pendingResultNums.length + ').'; return;
    }
    var nums = pendingResultNums.slice().sort(function(a,b){return a-b;});
    var concurso = document.getElementById('blResConcurso').value.trim();
    var data = document.getElementById('blResData').value;
    state.resultado = { numeros: nums, concurso: concurso || null, data: data || null };
    wrap.innerHTML = '';
    updateHeader();
    renderJogos();
    saveResultado().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
  });
}

function renderPreview(){
  var wrap = document.getElementById('blPreviewWrap');
  if(!previewGames.length){ wrap.innerHTML = ''; return; }
  var selectable = previewGames.filter(function(g){ return !g.duplicado; });
  var allChecked = selectable.length > 0 && selectable.every(function(g){ return g.checked; });
  var dupCount = previewGames.filter(function(g){ return g.duplicado; }).length;
  var nearCount = previewGames.filter(function(g){ return g.quaseDuplicado; }).length;
  var html = '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px;">';
  if(dupCount || nearCount){
    var msgs = [];
    if(dupCount) msgs.push(dupCount + ' jogo' + (dupCount===1?'':'s') + ' id\u00eantico' + (dupCount===1?'':'s') + ' a algo j\u00e1 cadastrado \u2014 n\u00e3o ser\u00e3o adicionados novamente.');
    if(nearCount) msgs.push(nearCount + ' jogo' + (nearCount===1?'':'s') + ' com apenas 1 dezena de diferen\u00e7a em rela\u00e7\u00e3o a um jogo j\u00e1 cadastrado \u2014 revise antes de confirmar.');
    html += '<div class="bl-note" style="margin-bottom:10px;">' + msgs.join(' ') + '</div>';
  }
  html += '<div class="bl-row" style="justify-content:space-between;margin-bottom:8px;">';
  html += '<label class="bl-check-toggle"><input type="checkbox" id="blSelectAllPreview" ' + (allChecked?'checked':'') + (selectable.length?'':' disabled') + ' /> Marcar todos (' + selectable.length + ' de ' + previewGames.length + ' dispon\u00edveis)</label>';
  html += '<button class="bl-btn" id="blCommitPreviewBtn" type="button">Adicionar marcados a Nossos Jogos</button>';
  html += '</div>';
  html += '<div style="max-height:340px;overflow:auto;">';
  previewGames.forEach(function(g, idx){
    html += '<div class="bl-preview-row ' + (g.duplicado?'dup':'') + '">';
    html += '<span class="bl-preview-idx">#' + (idx+1) + '</span>';
    if(g.duplicado){
      html += '<label class="bl-check-toggle"><input type="checkbox" disabled /></label>';
    } else {
      html += '<label class="bl-check-toggle"><input type="checkbox" class="blPreviewCheck" data-idx="' + idx + '" ' + (g.checked?'checked':'') + ' /></label>';
    }
    html += renderMiniBalls(g.numeros);
    if(g.duplicado){
      html += '<span class="bl-dup-badge">J\u00e1 existe</span>';
    } else if(g.quaseDuplicado){
      html += '<span class="bl-dup-badge" style="background:var(--gold-bg);color:#8F6B12;">Difere em 1 dezena</span>';
    } else {
      html += '<span class="bl-preview-meta">' + g.numeros.length + ' dezenas</span>';
    }
    html += '</div>';
  });
  html += '</div></div>';
  wrap.innerHTML = html;

  var selectAll = document.getElementById('blSelectAllPreview');
  if(selectAll){
    selectAll.addEventListener('change', function(){
      var v = this.checked;
      previewGames.forEach(function(g){ if(!g.duplicado) g.checked = v; });
      renderPreview();
    });
  }
  wrap.querySelectorAll('.blPreviewCheck').forEach(function(cb){
    cb.addEventListener('change', function(){
      previewGames[parseInt(this.dataset.idx)].checked = this.checked;
    });
  });
  document.getElementById('blCommitPreviewBtn').addEventListener('click', function(){
    var existingKeys = existingJogoKeys();
    var chosen = previewGames.filter(function(g){ return g.checked && !g.duplicado && !existingKeys.has(jogoKey(g.numeros)); });
    if(!chosen.length) return;
    var novos = chosen.map(function(g){
      return { id: 'j_' + Date.now() + '_' + Math.floor(Math.random()*10000), numeros: g.numeros, origem: previewOrigem, selecionado: true, criadoEm: new Date().toISOString() };
    });
    state.jogos = state.jogos.concat(novos);
    previewGames = [];
    state.jogosMsg = novos.length + ' jogo' + (novos.length===1?'':'s') + ' adicionado' + (novos.length===1?'':'s') + ' a Nossos Jogos.';
    updateHeader();
    renderJogos();
    saveJogos().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
  });
}

function palpitePanelHtml(){
  if(state.apostasFechadas && !state.unlocked){
    return '<div class="bl-panel"><h3>\uD83D\uDD12 Meus palpites</h3>' +
      '<div class="bl-note" style="background:#FBEDED;border-color:#EAC9C9;color:var(--danger);">As apostas deste concurso j\u00e1 foram <strong>fechadas</strong> pelo organizador. N\u00e3o \u00e9 mais poss\u00edvel cadastrar, editar ou remover palpites.</div>' +
      '</div>';
  }
  var count = countPalpitesByName(palpiteNomeAtual);
  var temNome = !!palpiteNomeAtual.trim();
  var atLimit = temNome && count >= 10;
  var html = '<div class="bl-panel"><h3>\uD83D\uDCDD Cadastre seu palpite</h3>';
  html += '<p class="bl-hint">Todo participante pode cadastrar aqui os pr\u00f3prios palpites para o bol\u00e3o, at\u00e9 o limite de <strong>10 palpites por pessoa</strong>. Cada palpite passa pela mesma verifica\u00e7\u00e3o de duplicidade usada no Gerador de jogos e tamb\u00e9m pela checagem de padr\u00f5es (pares/\u00edmpares, sequ\u00eancias, moldura/miolo, primos e m\u00faltiplos de 3) \u2014 s\u00f3 fica apto a entrar no portif\u00f3lio quem passar em todas. Voc\u00ea pode remover seus pr\u00f3prios palpites pendentes; depois que o organizador selecionar um palpite para a lista oficial, s\u00f3 ele pode remov\u00ea-lo.</p>';
  if(state.participants.length){
    var sortedParts = state.participants.slice().sort(function(a,b){ return a.nome.localeCompare(b.nome, 'pt-BR', {sensitivity:'base'}); });
    html += '<div class="bl-field"><label>Seu nome</label><select class="bl-input" id="blPalpiteNome" style="width:100%;">';
    html += '<option value=""' + (palpiteNomeAtual ? '' : ' selected') + '>Selecione seu nome\u2026</option>';
    sortedParts.forEach(function(p){
      html += '<option value="' + escapeHtml(p.nome) + '"' + (normName(p.nome) === normName(palpiteNomeAtual) ? ' selected' : '') + '>' + escapeHtml(p.nome) + '</option>';
    });
    html += '</select></div>';
  } else {
    html += '<div class="bl-note">Ainda n\u00e3o h\u00e1 participantes cadastrados. Pe\u00e7a ao organizador para cadastrar seu nome na aba "Participantes" antes de enviar um palpite.</div>';
  }
  html += '<p class="bl-pick-count" id="blPalpiteCount">' + count + ' de 10 palpites cadastrados' + (temNome ? ' por ' + escapeHtml(palpiteNomeAtual.trim()) : '') + '</p>';
  html += '<div class="bl-error" id="blPalpiteLimitErr">' + (atLimit ? 'Voc\u00ea j\u00e1 atingiu o limite de 10 palpites com esse nome.' : '') + '</div>';
  html += '<div class="bl-row"><button class="bl-btn secondary" id="blPalpiteToggleBtn" type="button"' + (atLimit ? ' disabled' : '') + '>+ Montar meu palpite na grelha</button></div>';
  html += '<div id="blPalpiteForm"></div>';
  html += '<div id="blMeusPalpitesList" style="margin-top:12px;"></div>';
  html += '</div>';
  return html;
}

function initPalpitePanel(){
  var nomeInput = document.getElementById('blPalpiteNome');
  if(!nomeInput) return;
  nomeInput.addEventListener('change', function(){
    palpiteNomeAtual = this.value;
    var wrap = document.getElementById('blPalpiteForm');
    if(wrap){ wrap.innerHTML = ''; }
    updatePalpiteCounter();
  });
  var toggleBtn = document.getElementById('blPalpiteToggleBtn');
  if(toggleBtn){
    toggleBtn.addEventListener('click', function(){
      togglePalpiteForm();
    });
  }
  updatePalpiteCounter();
}

function updatePalpiteCounter(){
  var temNome = !!palpiteNomeAtual.trim();
  var count = countPalpitesByName(palpiteNomeAtual);
  var atLimit = temNome && count >= 10;
  var countEl = document.getElementById('blPalpiteCount');
  if(countEl){ countEl.textContent = count + ' de 10 palpites cadastrados' + (temNome ? ' por ' + palpiteNomeAtual.trim() : ''); }
  var errEl = document.getElementById('blPalpiteLimitErr');
  if(errEl){ errEl.textContent = atLimit ? 'Voc\u00ea j\u00e1 atingiu o limite de 10 palpites com esse nome.' : ''; }
  var toggleBtn = document.getElementById('blPalpiteToggleBtn');
  if(toggleBtn){ toggleBtn.disabled = atLimit; }
  renderMeusPalpites();
}

function renderMeusPalpites(){
  var wrap = document.getElementById('blMeusPalpitesList');
  if(!wrap) return;
  var n = normName(palpiteNomeAtual);
  if(!n){ wrap.innerHTML = ''; return; }
  var all = state.jogos.filter(function(j){ return j.palpiteDe && normName(j.palpiteDe) === n; });
  if(!all.length){
    wrap.innerHTML = '<p class="bl-hint">Nenhum palpite cadastrado ainda com esse nome.</p>';
    return;
  }
  var pendentes = all.filter(function(j){ return !j.selecionado; })
    .sort(function(a,b){ return new Date(b.criadoEm) - new Date(a.criadoEm); });
  var oficiais = all.length - pendentes.length;
  var html = '';
  if(oficiais){
    html += '<p class="bl-hint" style="margin-bottom:8px;">\u2713 ' + oficiais + ' palpite' + (oficiais===1?'':'s') + ' seu' + (oficiais===1?'':'s') + ' j\u00e1 ' + (oficiais===1?'foi selecionado':'foram selecionados') + ' pelo organizador para a lista oficial do bol\u00e3o \u2014 sa\u00ed' + (oficiais===1?'u':'ram') + ' desta lista de palpites pendentes.</p>';
  }
  if(!pendentes.length){
    html += '<p class="bl-hint">Nenhum palpite pendente no momento' + (oficiais ? ' \u2014 todos os seus j\u00e1 est\u00e3o na lista oficial.' : '.') + '</p>';
    wrap.innerHTML = html;
    return;
  }
  html += '<p class="bl-hint" style="margin-bottom:8px;"><strong>Meus palpites pendentes (' + pendentes.length + ')</strong> \u2014 aguardando o organizador escolher os que v\u00e3o compor a lista oficial. Voc\u00ea pode remover qualquer um deles.</p>';
  pendentes.forEach(function(j){
    html += '<div class="bl-card">';
    html += '<div class="bl-row" style="justify-content:space-between;align-items:center;margin-bottom:8px;">';
    html += '<span class="bl-draw-date">' + j.numeros.length + ' dezenas \u00b7 ' + fmtDateTime(j.criadoEm) + '</span>';
    html += '<div class="bl-row" style="gap:6px;align-items:center;">';
    html += '<span class="bl-badge sel">\u2713 Dentro dos padr\u00f5es</span>';
    html += '<button class="bl-icon-del" data-id="' + j.id + '" data-action="del-meu-palpite" type="button" aria-label="Remover meu palpite">Remover</button>';
    html += '</div>';
    html += '</div>';
    html += renderMiniBalls(j.numeros);
    html += '</div>';
  });
  wrap.innerHTML = html;

  wrap.querySelectorAll('[data-action="del-meu-palpite"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = this.dataset.id;
      state.jogos = state.jogos.filter(function(j){ return j.id !== id; });
      updateHeader();
      updatePalpiteCounter();
      saveJogos().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
    });
  });
}

function togglePalpiteForm(){
  var wrap = document.getElementById('blPalpiteForm');
  if(wrap.innerHTML){ wrap.innerHTML = ''; return; }
  var nome = palpiteNomeAtual.trim();
  if(!nome){
    var errEl = document.getElementById('blPalpiteLimitErr');
    if(errEl){ errEl.textContent = 'Informe seu nome antes de montar o palpite.'; }
    return;
  }
  if(countPalpitesByName(nome) >= 10){
    var errEl2 = document.getElementById('blPalpiteLimitErr');
    if(errEl2){ errEl2.textContent = 'Voc\u00ea j\u00e1 atingiu o limite de 10 palpites com esse nome.'; }
    return;
  }
  pendingPalpiteNums = [];
  var html = '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px;">';
  html += '<div class="bl-note" style="margin-bottom:10px;"><strong>Completar automaticamente</strong><br>Marque na grelha as dezenas que voc\u00ea quer <strong>fixar</strong> e deixe o app completar as demais pela frequ\u00eancia dos sorteios. As dezenas fixadas ficam em magenta e as completadas em dourado; se tocar em uma completada, ela sai do jogo.';
  html += '<div class="bl-row" style="margin-top:8px;flex-wrap:wrap;gap:6px;">';
  html += '<select class="bl-input" id="blAutoSize" style="width:auto;">';
  for(var szA=BET_MIN; szA<=BET_MAX; szA++){ html += '<option value="'+szA+'">Jogo de '+szA+' dezenas</option>'; }
  html += '</select>';
  html += '<select class="bl-input" id="blAutoCrit" style="width:auto;"><option value="alta">Alta frequ\u00eancia</option><option value="baixa">Baixa frequ\u00eancia</option><option value="misto">Mista</option></select>';
  html += '<select class="bl-input" id="blAutoWin" style="width:auto;"><option value="10">\u00faltimos 10</option><option value="20">\u00faltimos 20</option><option value="30" selected>\u00faltimos 30</option><option value="9999">todos</option></select>';
  html += '<button class="bl-btn secondary" id="blAutoBtn" type="button">Completar jogo</button>';
  html += '</div><div class="bl-legend" style="margin-top:8px;"><span><span class="bl-legend-dot" style="background:var(--magenta);"></span> fixada por voc\u00ea</span><span><span class="bl-legend-dot" style="background:var(--gold);"></span> completada pelo app</span></div>';
  html += '<div class="bl-hint" id="blAutoMsg" style="margin-top:6px;"></div></div>';
  html += '<div class=\"bl-field\"><label>Marque de ' + BET_MIN + ' a ' + BET_MAX + ' n\u00fameros</label>';
  html += '<p class="bl-pick-count" id="blPalpitePickCount">0 selecionados</p>';
  html += '<div class="bl-pick-grid" id="blPalpitePickGrid"></div></div>';
  html += '<div class="bl-error" id="blPalpiteWarn" style="color:var(--gold);"></div>';
  html += '<div id="blPalpitePatterns"></div>';
  html += '<div class="bl-error" id="blPalpiteErr"></div>';
  html += '<div class="bl-row"><button class="bl-btn" id="blSavePalpiteBtn" type="button">Salvar palpite</button><button class="bl-btn secondary" id="blCancelPalpiteBtn" type="button">Cancelar</button></div>';
  html += '</div>';
  wrap.innerHTML = html;

  var autoAdded = new Set();

  function checkPending(){
    var warnEl = document.getElementById('blPalpiteWarn');
    var saveBtn = document.getElementById('blSavePalpiteBtn');
    var patternsEl = document.getElementById('blPalpitePatterns');
    warnEl.textContent = '';
    patternsEl.innerHTML = '';
    saveBtn.disabled = false;
    if(pendingPalpiteNums.length < BET_MIN || pendingPalpiteNums.length > BET_MAX) return;
    var exact = findExactDuplicate(pendingPalpiteNums);
    if(exact){
      warnEl.style.color = 'var(--danger)';
      warnEl.textContent = 'Esse jogo j\u00e1 est\u00e1 cadastrado em Nossos Jogos \u2014 n\u00e3o \u00e9 poss\u00edvel salvar um palpite id\u00eantico.';
      saveBtn.disabled = true;
      return;
    }
    var near = findNearDuplicate(pendingPalpiteNums);
    if(near){
      warnEl.style.color = '#8F6B12';
      warnEl.textContent = 'Aten\u00e7\u00e3o: esse palpite difere em apenas 1 dezena de um jogo j\u00e1 cadastrado. Voc\u00ea ainda pode salvar, mas revise antes.';
    }
    var check = checkParticipantPatterns(pendingPalpiteNums);
    if(check.apto){
      patternsEl.innerHTML = '<div class="bl-note" style="background:var(--sel-bg);border-color:var(--sel-line);color:var(--sel-text);">\u2713 Dentro das regras de padr\u00e3o (pares/\u00edmpares, sequ\u00eancias, moldura/miolo, primos e m\u00faltiplos de 3) \u2014 ' + escapeHtml(check.fonte) + '.</div>';
      saveBtn.disabled = false;
    } else {
      patternsEl.innerHTML = '<div class="bl-note" style="background:#FBEDED;border-color:#EAC9C9;color:var(--danger);"><strong>Fora das regras de padr\u00e3o</strong> \u2014 ' + escapeHtml(check.fonte) + ':<br>' + check.falhas.map(function(f){ return '\u2022 ' + escapeHtml(f); }).join('<br>') + '<br>Ajuste os n\u00fameros marcados para que o palpite fique apto a entrar no portif\u00f3lio.</div>';
      saveBtn.disabled = true;
    }
  }

  var grid = document.getElementById('blPalpitePickGrid');
  for(var n=1;n<=MAX_NUM;n++){
    var b = document.createElement('button');
    b.type='button'; b.className='bl-pick'; b.textContent=n; b.dataset.n=n;
    b.addEventListener('click', function(){
      var num = parseInt(this.dataset.n);
      var idx = pendingPalpiteNums.indexOf(num);
      if(idx>-1){ pendingPalpiteNums.splice(idx,1); this.classList.remove('sel'); this.classList.remove('auto'); autoAdded.delete(num); }
      else{ pendingPalpiteNums.push(num); this.classList.add('sel'); }
      document.getElementById('blPalpitePickCount').textContent = pendingPalpiteNums.length + ' selecionados';
      checkPending();
    });
    grid.appendChild(b);
  }

  document.getElementById('blCancelPalpiteBtn').addEventListener('click', function(){ wrap.innerHTML=''; });

  function refreshPickGrid(){
    grid.querySelectorAll('.bl-pick').forEach(function(btn){
      var nn = parseInt(btn.dataset.n, 10);
      btn.classList.toggle('sel', pendingPalpiteNums.indexOf(nn) > -1);
      btn.classList.toggle('auto', autoAdded.has(nn));
    });
    document.getElementById('blPalpitePickCount').textContent = pendingPalpiteNums.length + ' selecionados';
    checkPending();
  }
  document.getElementById('blAutoBtn').addEventListener('click', function(){
    var msgEl = document.getElementById('blAutoMsg');
    var size = parseInt(document.getElementById('blAutoSize').value, 10);
    var crit = document.getElementById('blAutoCrit').value;
    var win = parseInt(document.getElementById('blAutoWin').value, 10);
    // nova tentativa: as completadas anteriores saem, as fixas continuam
    pendingPalpiteNums = pendingPalpiteNums.filter(function(n){ return !autoAdded.has(n); });
    autoAdded = new Set();
    var fixed = pendingPalpiteNums.slice();
    var need = size - fixed.length;
    if(need < 0){ msgEl.style.color = 'var(--danger)'; msgEl.textContent = 'Voc\u00ea fixou ' + fixed.length + ' dezenas, mais do que o tamanho escolhido (' + size + '). Aumente o tamanho do jogo ou desmarque dezenas.'; refreshPickGrid(); return; }
    if(need === 0){ msgEl.style.color = 'var(--muted)'; msgEl.textContent = 'As dezenas fixadas j\u00e1 completam o jogo de ' + size + ' dezenas.'; refreshPickGrid(); return; }
    var draws = officialDraws.slice().sort(function(a,b){ return a.data < b.data ? 1 : (a.data > b.data ? -1 : b.concurso - a.concurso); }).slice(0, win);
    if(!draws.length){ msgEl.style.color = 'var(--danger)'; msgEl.textContent = 'N\u00e3o h\u00e1 sorteios cadastrados para calcular a frequ\u00eancia.'; refreshPickGrid(); return; }
    var freq = {};
    for(var fn=1; fn<=MAX_NUM; fn++){ freq[fn] = 0; }
    draws.forEach(function(d){ d.dezenas.forEach(function(n){ freq[n]++; }); });
    var cands = [];
    for(var cn=1; cn<=MAX_NUM; cn++){ if(fixed.indexOf(cn) === -1) cands.push(cn); }
    function pick(noise){
      var key = {};
      cands.forEach(function(n){ key[n] = freq[n] + Math.random()*noise; });
      var hi = cands.slice().sort(function(a,b){ return key[b]-key[a]; });
      var lo = cands.slice().sort(function(a,b){ return key[a]-key[b]; });
      if(crit === 'baixa') return lo.slice(0, need);
      if(crit === 'misto'){
        var h = Math.ceil(need/2), a1 = hi.slice(0, h), used = new Set(a1);
        return a1.concat(lo.filter(function(n){ return !used.has(n); }).slice(0, need - h));
      }
      return hi.slice(0, need);
    }
    var chosen = null, first = null, i;
    for(i=0; i<300; i++){
      var cand = pick(0.5 + i/10);
      if(!first) first = cand;
      var full = fixed.concat(cand);
      if(!findExactDuplicate(full) && checkParticipantPatterns(full).apto){ chosen = cand; break; }
    }
    var okPattern = !!chosen;
    if(!chosen) chosen = first;
    chosen.forEach(function(n){ pendingPalpiteNums.push(n); autoAdded.add(n); });
    var critTxt = crit === 'alta' ? 'alta frequ\u00eancia' : (crit === 'baixa' ? 'baixa frequ\u00eancia' : 'mista (metade alta, metade baixa)');
    msgEl.style.color = okPattern ? 'var(--sel-text)' : '#8F6B12';
    msgEl.textContent = okPattern
      ? fixed.length + ' dezena(s) fixa(s) + ' + chosen.length + ' completada(s) por ' + critTxt + ' nos ' + (win >= 9999 ? 'sorteios cadastrados' : '\u00faltimos ' + Math.min(win, draws.length) + ' sorteios') + '. Toque em "Completar jogo" de novo para outra combina\u00e7\u00e3o.'
      : 'N\u00e3o encontrei uma combina\u00e7\u00e3o dentro das regras de padr\u00e3o com essas dezenas fixas e esse crit\u00e9rio. Ajuste manualmente as dezenas indicadas abaixo ou fixe menos dezenas.';
    refreshPickGrid();
  });

  document.getElementById('blSavePalpiteBtn').addEventListener('click', function(){
    var err = document.getElementById('blPalpiteErr');
    var nomeAtual = palpiteNomeAtual.trim();
    if(!nomeAtual){ err.textContent = 'Informe seu nome antes de salvar o palpite.'; return; }
    if(countPalpitesByName(nomeAtual) >= 10){ err.textContent = 'Voc\u00ea j\u00e1 atingiu o limite de 10 palpites com esse nome.'; return; }
    if(pendingPalpiteNums.length < BET_MIN || pendingPalpiteNums.length > BET_MAX){
      err.textContent = 'Selecione de ' + BET_MIN + ' a ' + BET_MAX + ' n\u00fameros (voc\u00ea marcou ' + pendingPalpiteNums.length + ').'; return;
    }
    if(findExactDuplicate(pendingPalpiteNums)){
      err.textContent = 'Esse jogo j\u00e1 est\u00e1 cadastrado em Nossos Jogos.'; return;
    }
    var check = checkParticipantPatterns(pendingPalpiteNums);
    if(!check.apto){
      err.textContent = 'Este palpite n\u00e3o passou na checagem de padr\u00f5es (pares/\u00edmpares, sequ\u00eancias, moldura/miolo, primos ou m\u00faltiplos de 3) e por isso n\u00e3o pode entrar no portif\u00f3lio. Ajuste os n\u00fameros marcados acima.'; return;
    }
    err.textContent = '';
    var nums = pendingPalpiteNums.slice().sort(function(a,b){return a-b;});
    state.jogos.push({ id: 'j_' + Date.now() + '_' + Math.floor(Math.random()*1000), numeros: nums, origem: 'Palpite de ' + nomeAtual, palpiteDe: nomeAtual, selecionado: false, criadoEm: new Date().toISOString() });
    state.jogosMsg = 'Seu palpite passou na checagem de padr\u00f5es e foi cadastrado em Nossos Jogos.';
    wrap.innerHTML = '';
    updateHeader();
    renderJogos();
    saveJogos().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
  });
}

function renderJogosList(filter){
  var list = document.getElementById('blJogosList');
  var allSorted = sortedJogos();
  var numberMap = {};
  allSorted.forEach(function(j, i){ numberMap[j.id] = allSorted.length - i; });

  var jogos = allSorted;

  if(state.jogosFilter === 'selecionados') jogos = jogos.filter(function(j){ return j.selecionado; });
  if(state.jogosFilter === 'nao') jogos = jogos.filter(function(j){ return !j.selecionado; });

  if(filter){
    var filterNum = parseInt(filter, 10);
    jogos = jogos.filter(function(j){
      var numMatch = !isNaN(filterNum) && numberMap[j.id] === filterNum;
      var origemMatch = j.origem.toLowerCase().indexOf(filter) > -1;
      return numMatch || origemMatch;
    });
  }

  if(!jogos.length){
    list.innerHTML = '<div class="bl-empty">Nenhum jogo encontrado. ' + (state.unlocked ? 'Use o painel acima para importar ou montar um jogo.' : 'Peça ao organizador para adicionar jogos.') + '</div>';
    return;
  }

  var temResultado = !!(state.resultado && state.resultado.numeros);
  if(temResultado && state.jogosOrdem === 'acertos'){
    jogos = jogos.slice().sort(function(a,b){ return (contarAcertos(b.numeros)||0) - (contarAcertos(a.numeros)||0); });
  }

  var html = '';

  var lastInfo = ultimoConcursoOficial();
  if(lastInfo){
    var diasAtras = Math.floor((Date.now() - new Date(lastInfo.data + 'T12:00:00').getTime()) / 86400000);
    html += '<div class="bl-hint" style="margin:0 0 8px;">Repeti\u00e7\u00f5es comparadas com o concurso ' + lastInfo.concurso + ' (' + lastInfo.data.split('-').reverse().join('/') + ')' + (diasAtras > 7 ? ' \u2014 \u26A0\uFE0F esse resultado tem ' + diasAtras + ' dias; a atualiza\u00e7\u00e3o autom\u00e1tica pode n\u00e3o estar funcionando.' : '.') + '</div>';
  }
  var totalRep = jogos.filter(function(j){ return alertaRepetidas(j.numeros); }).length;
  if(totalRep){
    var lastC = ultimoConcursoOficial();
    html += '<div class="bl-note" style="background:#FDECEC;border-color:#EBB4B4;color:var(--danger);font-weight:600;">\u26A0\uFE0F ' + totalRep + ' jogo(s) com ' + MIN_REP_ALERTA + ' ou mais dezenas repetidas do concurso ' + lastC.concurso + ' (' + lastC.dezenas.map(function(n){ return String(n).padStart(2,'0'); }).join(', ') + ').</div>';
  }

  if(state.jogosViewMode === 'lista'){
    html += '<div style="overflow-x:auto;"><table class="bl-list-table"><thead><tr>';
    html += '<th>#</th><th>Dezenas</th><th>Status</th>';
    if(temResultado) html += '<th>Acertos</th>';
    if(state.unlocked) html += '<th></th>';
    html += '</tr></thead><tbody>';
    jogos.forEach(function(j){
      var num = numberMap[j.id];
      var acertos = temResultado ? contarAcertos(j.numeros) : null;
      html += '<tr>';
      html += '<td class="bl-num">#' + num + '</td>';
      var alRep = alertaRepetidas(j.numeros);
      html += '<td class="bl-list-dezenas">' + j.numeros.map(function(n){ return String(n).padStart(2,'0'); }).join(' ') + (alRep ? '<div style="font-size:11px;color:var(--danger);font-weight:600;margin-top:2px;">' + escapeHtml(alertaRepetidasTexto(alRep)) + '</div>' : '') + '</td>';
      html += '<td><span class="bl-list-status ' + (j.selecionado?'sel':'') + '">' + (j.selecionado ? 'Selecionado' : '\u2014') + '</span></td>';
      if(temResultado){
        html += '<td><span class="bl-list-acertos ' + (acertos>=4?'premio':'') + '">' + acertos + '</span></td>';
      }
      if(state.unlocked){
        html += '<td><div class="bl-row" style="gap:8px;flex-wrap:nowrap;align-items:center;">';
        html += '<label class="bl-check-toggle" title="Selecionado para o bol\u00e3o"><input type="checkbox" data-id="' + j.id + '" class="blSelToggle" ' + (j.selecionado?'checked':'') + ' /></label>';
        html += '<button class="bl-icon-del" data-id="' + j.id + '" data-action="del-jogo" type="button" aria-label="Remover jogo">Remover</button>';
        html += '</div></td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    html += '<div class="bl-note" style="margin-top:12px;">Todos os ' + jogos.length + ' jogo(s) desta visualiza\u00e7\u00e3o, um por linha. Use "Ver participantes" acima para conferir quem est\u00e1 no bol\u00e3o.</div>';
  } else {
    jogos.forEach(function(j, idx){
      var num = numberMap[j.id];
      var acertos = temResultado ? contarAcertos(j.numeros) : null;
      html += '<div class="bl-card ' + (j.selecionado?'sel':'') + '">';
      html += '<div class="bl-draw-head"><div><span class="bl-draw-concurso">Jogo #' + num + '</span> <span class="bl-draw-date">\u00b7 ' + j.numeros.length + ' dezenas \u00b7 ' + escapeHtml(j.origem) + ' \u00b7 ' + fmtDateTime(j.criadoEm) + '</span></div>';
      html += '<div class="bl-row" style="gap:6px;">';
      if(temResultado){
        html += '<span class="bl-acertos-badge ' + (acertos>=4?'premio':'') + '">' + acertos + ' acerto' + (acertos===1?'':'s') + '</span>';
      }
      html += '<span class="bl-badge ' + (j.selecionado?'sel':'') + '">' + (j.selecionado ? 'Selecionado' : 'N\u00e3o selecionado') + '</span>';
      html += '</div></div>';
      var nearOther = findNearDuplicate(j.numeros, j.id);
      if(nearOther){
        html += '<div class="bl-note" style="margin:0 0 10px;padding:6px 10px;">Difere em apenas 1 dezena do Jogo #' + numberMap[nearOther.id] + '.</div>';
      }
      var alRepC = alertaRepetidas(j.numeros);
      if(alRepC){
        html += '<div class="bl-note" style="margin:0 0 10px;padding:6px 10px;background:#FDECEC;border-color:#EBB4B4;color:var(--danger);font-weight:600;">' + escapeHtml(alertaRepetidasTexto(alRepC)) + '</div>';
      }
      html += renderBallGrid(j.numeros, true);
      if(state.unlocked){
        html += '<div class="bl-row" style="margin-top:10px;align-items:center;">';
        html += '<label class="bl-check-toggle"><input type="checkbox" data-id="' + j.id + '" class="blSelToggle" ' + (j.selecionado?'checked':'') + ' /> Selecionado para o bol\u00e3o</label>';
        html += '<button class="bl-icon-del" data-id="' + j.id + '" data-action="del-jogo" type="button" aria-label="Remover jogo">Remover</button>';
        html += '</div>';
      }
      html += '</div>';
    });
  }
  list.innerHTML = html;

  if(state.unlocked){
    list.querySelectorAll('.blSelToggle').forEach(function(cb){
      cb.addEventListener('change', function(){
        var id = this.dataset.id;
        var jogo = state.jogos.find(function(j){ return j.id === id; });
        if(jogo){
          jogo.selecionado = this.checked;
          updateHeader();
          renderJogosList(document.getElementById('blSearchJogo').value.trim().toLowerCase());
          renderMeusPalpites();
          saveJogos().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
        }
      });
    });
    list.querySelectorAll('[data-action="del-jogo"]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = this.dataset.id;
        state.jogos = state.jogos.filter(function(j){ return j.id !== id; });
        updateHeader();
        renderJogosList(document.getElementById('blSearchJogo').value.trim().toLowerCase());
        saveJogos().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
      });
    });
  }
}

function baixarComprovanteParticipantePDF(participante, btn){
  var originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Gerando\u2026'; }

  loadJsPDF().then(function(){
    var jsPDFCtor = window.jspdf.jsPDF;
    var doc = new jsPDFCtor({ unit: 'pt', format: 'a4' });
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var margin = 46;
    var y = 0;

    var temValor = state.cotaValor !== null && state.cotaValor !== undefined;
    var valorDevido = temValor ? participante.cotas * state.cotaValor : null;
    var selecionados = state.jogos.filter(function(j){ return j.selecionado; });
    var totalCotasBolao = state.participants.reduce(function(s,p){ return s + p.cotas; }, 0);

    // Cabe\u00e7alho
    doc.setFillColor(58, 18, 64);
    doc.rect(0, 0, pageWidth, 74, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(17);
    doc.text(state.appTitle.title, margin, 34);
    doc.setFont('helvetica','normal');
    doc.setFontSize(10.5);
    doc.text('Comprovante de participa\u00e7\u00e3o no bol\u00e3o', margin, 52);
    doc.setFontSize(8.5);
    doc.setTextColor(225,205,225);
    doc.text('Emitido em ' + new Date().toLocaleString('pt-BR'), margin, 66);

    // Linha pontilhada estilo "canhoto de bilhete"
    doc.setDrawColor(180,150,185);
    doc.setLineDash([2,3], 0);
    doc.line(margin, 88, pageWidth - margin, 88);
    doc.setLineDash([], 0);

    y = 116;
    doc.setTextColor(30,20,30);
    doc.setFont('helvetica','bold');
    doc.setFontSize(20);
    doc.text(participante.nome, margin, y);

    y += 22;
    var statusTxt = participante.isento ? 'ISENTO' : (participante.pago ? 'PAGO' : 'PENDENTE');
    var statusColor = participante.isento ? [138,123,142] : (participante.pago ? [47,125,79] : [184,114,11]);
    var badgeWidth = participante.isento ? 78 : 70;
    doc.setFillColor(statusColor[0], statusColor[1], statusColor[2]);
    doc.roundedRect(margin, y - 12, badgeWidth, 18, 9, 9, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(9.5);
    doc.text(statusTxt, margin + (badgeWidth/2), y, { align: 'center' });

    y += 34;
    doc.setTextColor(30,20,30);
    function linhaDado(label, valor){
      doc.setFont('helvetica','normal');
      doc.setFontSize(9.5);
      doc.setTextColor(140,130,140);
      doc.text(label, margin, y);
      doc.setFont('helvetica','bold');
      doc.setFontSize(12.5);
      doc.setTextColor(30,20,30);
      doc.text(String(valor), margin, y + 15);
      y += 38;
    }
    linhaDado('Cotas adquiridas', participante.cotas + (participante.cotas === 1 ? ' cota' : ' cotas') + ' de ' + totalCotasBolao + ' (' + (totalCotasBolao > 0 ? Math.round((participante.cotas / totalCotasBolao) * 1000)/10 : 0) + '% do bol\u00e3o)');
    linhaDado('Valor por cota', temValor ? formatMoney(state.cotaValor) : 'A definir pelo organizador');
    linhaDado('Valor total devido', participante.isento ? 'Isento de pagamento' : (temValor ? formatMoney(valorDevido) : 'A definir pelo organizador'));
    linhaDado(participante.pago ? 'Pago em' : 'Participante desde', fmtDateTime(participante.criadoEm));

    // Lista de jogos selecionados do bol\u00e3o (se houver)
    if(selecionados.length){
      y += 4;
      doc.setDrawColor(230,222,230);
      doc.line(margin, y, pageWidth - margin, y);
      y += 20;
      doc.setFont('helvetica','bold');
      doc.setFontSize(11.5);
      doc.setTextColor(90,20,90);
      doc.text('Jogos selecionados neste bol\u00e3o (' + selecionados.length + ')', margin, y);
      y += 16;
      selecionados.forEach(function(j, idx){
        if(y > pageHeight - 60){ doc.addPage(); y = 50; }
        var dezenas = j.numeros.map(function(n){ return String(n).padStart(2,'0'); }).join(' ');
        doc.setFont('helvetica','bold');
        doc.setFontSize(9);
        doc.setTextColor(90,20,90);
        doc.text('#' + (idx+1), margin, y);
        doc.setFont('courier','normal');
        doc.setFontSize(10);
        doc.setTextColor(30,20,30);
        doc.text(dezenas, margin + 26, y);
        y += 15;
      });
    } else {
      y += 4;
      doc.setFont('helvetica','normal');
      doc.setFontSize(9.5);
      doc.setTextColor(140,130,140);
      doc.text('Nenhum jogo foi marcado como selecionado para o bol\u00e3o ainda.', margin, y);
    }

    doc.setFont('helvetica','normal');
    doc.setFontSize(8);
    doc.setTextColor(140,130,140);
    doc.text('Documento gerado automaticamente pelo sistema do bol\u00e3o \u2014 n\u00e3o \u00e9 um comprovante fiscal.', margin, pageHeight - 24);

    var fileSafeName = participante.nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    doc.save('comprovante-' + (fileSafeName || 'participante') + '.pdf');
  }).catch(function(e){
    console.error('Erro ao gerar comprovante:', e);
    alert('N\u00e3o foi poss\u00edvel gerar o comprovante agora. Verifique sua conex\u00e3o com a internet e tente novamente.');
  }).finally(function(){
    if(btn){ btn.disabled = false; btn.textContent = originalLabel || '\uD83E\uDDFE Comprovante'; }
  });
}

// Gera um resumo geral em PDF com todos os participantes, cotas, valores e
// status de pagamento \u2014 \u00fatil pro organizador imprimir ou compartilhar com
// o grupo inteiro de uma vez.
function baixarResumoGeralPDF(btn){
  if(!state.participants.length) return;
  var originalLabel = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Gerando\u2026'; }

  loadJsPDF().then(function(){
    var jsPDFCtor = window.jspdf.jsPDF;
    var doc = new jsPDFCtor({ unit: 'pt', format: 'a4' });
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var margin = 46;
    var y = 0;

    var temValor = state.cotaValor !== null && state.cotaValor !== undefined;
    var sorted = state.participants.slice().sort(function(a,b){ return a.nome.localeCompare(b.nome,'pt-BR',{sensitivity:'base'}); });
    var totalCotas = sorted.reduce(function(s,p){ return s+p.cotas; }, 0);
    var pagantes = sorted.filter(function(p){ return !p.isento; });
    var totalBolao = temValor ? totalCotas * state.cotaValor : null;
    var totalArrecadar = temValor ? pagantes.reduce(function(s,p){return s+p.cotas;},0) * state.cotaValor : null;
    var totalPago = temValor ? pagantes.filter(function(p){return p.pago;}).reduce(function(s,p){return s+p.cotas;},0) * state.cotaValor : null;

    function drawHeader(){
      doc.setFillColor(58, 18, 64);
      doc.rect(0, 0, pageWidth, 70, 'F');
      doc.setTextColor(255,255,255);
      doc.setFont('helvetica','bold');
      doc.setFontSize(16);
      doc.text(state.appTitle.title + ' \u2014 Resumo do rateio', margin, 32);
      doc.setFont('helvetica','normal');
      doc.setFontSize(9.5);
      var resumoLine = sorted.length + ' participante(s) \u00b7 ' + totalCotas + ' cota(s)';
      if(temValor){ resumoLine += ' \u00b7 total do bol\u00e3o ' + formatMoney(totalBolao) + ' \u00b7 pago ' + formatMoney(totalPago); }
      doc.text(resumoLine, margin, 50);
      y = 92;
      doc.setTextColor(30,20,30);
    }
    function drawFooter(){
      var pageCount = doc.internal.getNumberOfPages();
      for(var i=1;i<=pageCount;i++){
        doc.setPage(i);
        doc.setFont('helvetica','normal');
        doc.setFontSize(8);
        doc.setTextColor(140,130,140);
        doc.text('P\u00e1gina ' + i + ' de ' + pageCount, pageWidth - margin, pageHeight - 20, { align: 'right' });
        doc.text('Gerado em ' + new Date().toLocaleString('pt-BR'), margin, pageHeight - 20);
      }
    }

    drawHeader();

    // Cabe\u00e7alho da tabela
    doc.setFont('helvetica','bold');
    doc.setFontSize(9.5);
    doc.setTextColor(140,130,140);
    doc.text('PARTICIPANTE', margin, y);
    doc.text('COTAS', margin + 260, y);
    doc.text('VALOR DEVIDO', margin + 330, y);
    doc.text('STATUS', pageWidth - margin - 60, y);
    y += 8;
    doc.setDrawColor(225,217,225);
    doc.line(margin, y, pageWidth - margin, y);
    y += 18;

    sorted.forEach(function(p){
      if(y > pageHeight - 60){ doc.addPage(); drawHeader(); }
      var valorDevido = temValor ? p.cotas * state.cotaValor : null;
      doc.setFont('helvetica','normal');
      doc.setFontSize(10.5);
      doc.setTextColor(30,20,30);
      doc.text(p.nome, margin, y);
      doc.text(String(p.cotas), margin + 260, y);
      doc.text(p.isento ? '\u2014' : (temValor ? formatMoney(valorDevido) : '\u2013'), margin + 330, y);

      var statusTxt = p.isento ? 'ISENTO' : (p.pago ? 'PAGO' : 'PENDENTE');
      var statusColor = p.isento ? [138,123,142] : (p.pago ? [47,125,79] : [184,114,11]);
      doc.setTextColor(statusColor[0], statusColor[1], statusColor[2]);
      doc.setFont('helvetica','bold');
      doc.setFontSize(9.5);
      doc.text(statusTxt, pageWidth - margin, y, { align: 'right' });

      y += 10;
      doc.setDrawColor(240,235,240);
      doc.line(margin, y, pageWidth - margin, y);
      y += 18;
    });

    if(temValor){
      y += 6;
      doc.setFont('helvetica','bold');
      doc.setFontSize(11);
      doc.setTextColor(30,20,30);
      doc.text('Total do bol\u00e3o: ' + formatMoney(totalBolao) + '   \u00b7   A receber: ' + formatMoney(totalArrecadar) + '   \u00b7   Pago: ' + formatMoney(totalPago) + '   \u00b7   Pendente: ' + formatMoney(totalArrecadar - totalPago), margin, y);
    }

    drawFooter();
    doc.save('bolao-megasena-resumo-rateio.pdf');
  }).catch(function(e){
    console.error('Erro ao gerar resumo geral:', e);
    alert('N\u00e3o foi poss\u00edvel gerar o resumo agora. Verifique sua conex\u00e3o com a internet e tente novamente.');
  }).finally(function(){
    if(btn){ btn.disabled = false; btn.textContent = originalLabel || '\uD83D\uDCC4 Baixar resumo geral (PDF)'; }
  });
}


function renderParticipantes(){
  var totalCotas = state.participants.reduce(function(s,p){ return s + p.cotas; }, 0);
  var cotaFmt = formatMoney(state.cotaValor);
  var temValor = state.cotaValor !== null && state.cotaValor !== undefined;
  var pagantes = state.participants.filter(function(p){ return !p.isento; });
  var cotasIsentas = state.participants.filter(function(p){ return p.isento; }).reduce(function(s,p){ return s+p.cotas; }, 0);
  var totalBolao = temValor ? totalCotas * state.cotaValor : null;
  var totalArrecadar = temValor ? pagantes.reduce(function(s,p){return s+p.cotas;},0) * state.cotaValor : null;
  var totalPago = temValor ? pagantes.filter(function(p){return p.pago;}).reduce(function(s,p){ return s + p.cotas; }, 0) * state.cotaValor : null;
  var totalPendente = (totalArrecadar !== null && totalPago !== null) ? (totalArrecadar - totalPago) : null;
  var html = '';
  html += '<div class="bl-stats">';
  html += '<div class="bl-stat"><p class="bl-stat-label">Participantes</p><p class="bl-stat-val">' + state.participants.length + '</p></div>';
  html += '<div class="bl-stat"><p class="bl-stat-label">Total de cotas</p><p class="bl-stat-val">' + totalCotas + '</p></div>';
  html += '<div class="bl-stat"><p class="bl-stat-label">Valor da cota</p><p class="bl-stat-val">' + (cotaFmt || 'A definir') + '</p></div>';
  html += '</div>';

  if(temValor && state.participants.length){
    html += '<div class="bl-stats">';
    html += '<div class="bl-stat premio"><p class="bl-stat-label">Total de cotas (' + totalCotas + ')</p><p class="bl-stat-val">' + totalCotas + '</p></div>';
    html += '<div class="bl-stat" style="background:var(--paid-bg);border-color:var(--paid-line);"><p class="bl-stat-label" style="color:var(--paid);">J\u00e1 pago</p><p class="bl-stat-val" style="color:var(--paid);">' + formatMoney(totalPago) + '</p></div>';
    html += '<div class="bl-stat" style="background:var(--pending-bg);border-color:var(--pending-line);"><p class="bl-stat-label" style="color:var(--pending);">Pendente</p><p class="bl-stat-val" style="color:var(--pending);">' + formatMoney(totalPendente) + '</p></div>';
    html += '</div>';
    if(cotasIsentas > 0){
      html += '<div class="bl-note" style="margin-top:-6px;">O total do bol\u00e3o acima j\u00e1 inclui ' + cotasIsentas + ' cota' + (cotasIsentas===1?'':'s') + ' isenta' + (cotasIsentas===1?'':'s') + ' de pagamento. Como quem est\u00e1 isento n\u00e3o paga a pr\u00f3pria parte, "J\u00e1 pago" e "Pendente" consideram apenas os ' + formatMoney(totalArrecadar) + ' que realmente precisam ser cobrados dos demais participantes.</div>';
    }
  }

  if(state.unlocked){
    var cotaValorInputVal = (state.cotaValor !== null && state.cotaValor !== undefined) ? state.cotaValor.toFixed(2) : '';
    html += '<div class="bl-panel"><h3>Valor da cota</h3><p class="bl-hint">Defina quanto cada cota custa. Esse valor aparece para todo mundo no card acima.</p>';
    html += '<div class="bl-field"><label>Valor por cota (R$)</label><input class="bl-input" id="blCotaValorInput" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Ex: 15.00" value="' + cotaValorInputVal + '" /></div>';
    if(state.cotaValorErr){ html += '<div class="bl-error">' + escapeHtml(state.cotaValorErr) + '</div>'; }
    html += '<button class="bl-btn" id="blCotaValorSave" type="button">Salvar valor da cota</button></div>';

    html += '<div class="bl-panel"><h3>Cadastrar participante</h3>';
    html += '<div class="bl-field"><label>Nome do participante</label><input class="bl-input" id="blPName" placeholder="Nome completo" /></div>';
    html += '<div class="bl-field"><label>Quantidade de cotas adquiridas</label><input class="bl-input" id="blPCotas" type="number" min="1" step="1" placeholder="1" /></div>';
    html += '<div class="bl-error" id="blPErr"></div>';
    html += '<button class="bl-btn" id="blAddPartBtn" type="button">+ Adicionar participante</button>';
    html += '</div>';
  } else {
    html += '<div class="bl-note">Somente o organizador pode cadastrar participantes e definir a quantidade de cotas. Toque em "Sou o organizador" acima para desbloquear.</div>';
  }

  html += '<div class="bl-row" style="margin-bottom:8px;"><button class="bl-btn secondary" id="blPartReportBtn" type="button">Emitir relat\u00f3rio</button></div>';
  html += '<div id="blPartList"></div>';

  if(state.participants.length){
    if(state.apostasFechadas){
      html += '<button class="bl-btn secondary" id="blResumoGeralBtn" type="button" style="margin-top:6px;width:100%;">\uD83D\uDCC4 Baixar resumo geral (PDF)</button>';
    } else {
      html += '<div class="bl-note" style="margin-top:6px;">Os comprovantes (individuais e o resumo geral) ficam dispon\u00edveis assim que o organizador fechar as apostas na aba "Nossos jogos".</div>';
    }
  }

  var body = document.getElementById('blBody');
  body.innerHTML = html;

  renderPartList();

  var reportBtn = document.getElementById('blPartReportBtn');
  if(reportBtn){ reportBtn.addEventListener('click', openParticipantsReport); }

  var resumoBtn = document.getElementById('blResumoGeralBtn');
  if(resumoBtn){
    resumoBtn.addEventListener('click', function(){ baixarResumoGeralPDF(this); });
  }

  var cotaValorBtn = document.getElementById('blCotaValorSave');
  if(cotaValorBtn){
    cotaValorBtn.addEventListener('click', function(){
      var raw = document.getElementById('blCotaValorInput').value.replace(',', '.').trim();
      var val = parseFloat(raw);
      if(!raw || isNaN(val) || val < 0){ state.cotaValorErr = 'Informe um valor v\u00e1lido para a cota.'; renderParticipantes(); return; }
      state.cotaValorErr = '';
      state.cotaValor = val;
      renderParticipantes();
      window.storage.set('cotaValor', String(val), true).catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
    });
  }

  var addBtn = document.getElementById('blAddPartBtn');
  if(addBtn){
    addBtn.addEventListener('click', function(){
      var err = document.getElementById('blPErr');
      var name = document.getElementById('blPName').value.trim();
      var cotas = parseInt(document.getElementById('blPCotas').value);
      if(!name){ err.textContent = 'Informe o nome do participante.'; return; }
      if(!cotas || cotas < 1){ err.textContent = 'Informe uma quantidade de cotas v\u00e1lida (m\u00ednimo 1).'; return; }
      var p = { id: 'p_' + Date.now() + '_' + Math.floor(Math.random()*1000), nome: name, cotas: cotas, pago: false, isento: false, criadoEm: new Date().toISOString() };
      state.participants.push(p);
      err.textContent = '';
      updateHeader();
      renderParticipantes();
      saveParticipants().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
    });
  }
}

function renderPartList(){
  var list = document.getElementById('blPartList');
  if(!state.participants.length){
    list.innerHTML = '<div class="bl-empty">Nenhum participante cadastrado ainda.</div>';
    return;
  }
  var temValor = state.cotaValor !== null && state.cotaValor !== undefined;
  var sorted = state.participants.slice().sort(function(a,b){ return a.nome.localeCompare(b.nome, 'pt-BR', {sensitivity:'base'}); });
  var html = '';
  sorted.forEach(function(p){
    if(state.unlocked && state.editingPartId === p.id){
      html += '<div class="bl-participant" style="flex-direction:column;align-items:stretch;gap:8px;">';
      html += '<div class="bl-field" style="margin:0;"><label>Nome</label><input class="bl-input" id="blEditNome" value="' + escapeHtml(p.nome).replace(/"/g,'&quot;') + '" /></div>';
      html += '<div class="bl-field" style="margin:0;"><label>Cotas</label><input class="bl-input" id="blEditCotas" type="number" min="1" step="1" value="' + p.cotas + '" /></div>';
      if(state.editPartErr){ html += '<div class="bl-error">' + escapeHtml(state.editPartErr) + '</div>'; }
      html += '<div style="display:flex;gap:8px;">';
      html += '<button class="bl-btn" data-save-id="' + p.id + '" type="button" style="flex:1;">Salvar</button>';
      html += '<button class="bl-btn secondary" data-cancel-edit="1" type="button" style="flex:1;">Cancelar</button>';
      html += '</div></div>';
      return;
    }
    var valorDevido = temValor ? p.cotas * state.cotaValor : null;
    var payClass = p.isento ? 'isento' : (p.pago ? 'paid' : 'pending');
    var payLabel = p.isento ? '\u2014 Isento' : (p.pago ? '\u2713 Pago' : 'Pendente');
    var dateLabel = p.pago ? 'Pago em ' : 'Cadastrado em ';
    html += '<div class="bl-participant">';
    html += '<div><p class="bl-p-name">' + escapeHtml(p.nome) + '</p><p class="bl-p-meta">' + dateLabel + fmtDateTime(p.criadoEm) + '</p></div>';
    html += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">';
    html += '<span class="bl-p-cotas bl-num">' + p.cotas + (p.cotas===1?' cota':' cotas') + '</span>';
    if(temValor){
      html += '<span class="bl-p-valor">' + (p.isento ? 'isento' : ('<strong>' + formatMoney(valorDevido) + '</strong>')) + '</span>';
    }
    html += '<span class="bl-pay-badge ' + payClass + '" data-pay-id="' + p.id + '" role="' + (state.unlocked ? 'button' : 'status') + '" title="' + (state.unlocked ? 'Toque para alternar entre Pendente, Pago e Isento' : '') + '">' + payLabel + '</span>';
    if(state.apostasFechadas){
      html += '<button class="bl-btn secondary" data-receipt-id="' + p.id + '" type="button" style="font-size:11.5px;padding:6px 10px;">\uD83E\uDDFE Comprovante</button>';
    }
    if(state.unlocked){
      html += '<button class="bl-icon-edit" data-edit-id="' + p.id + '" type="button" aria-label="Editar participante">Editar</button>';
      html += '<button class="bl-icon-del" data-id="' + p.id + '" type="button" aria-label="Remover participante">Remover</button>';
    }
    html += '</div></div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('.bl-pay-badge[data-pay-id]').forEach(function(badge){
    if(!state.unlocked){ badge.style.cursor = 'default'; return; }
    badge.addEventListener('click', function(){
      var id = this.dataset.payId;
      var p = state.participants.find(function(x){ return x.id === id; });
      if(!p) return;
      // Alterna em ciclo: Pendente -> Pago -> Isento -> Pendente...
      if(p.isento){ p.isento = false; p.pago = false; }
      else if(p.pago){ p.isento = true; }
      else { p.pago = true; p.criadoEm = new Date().toISOString(); }
      renderParticipantes();
      saveParticipants().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
    });
  });

  list.querySelectorAll('[data-receipt-id]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = this.dataset.receiptId;
      var p = state.participants.find(function(x){ return x.id === id; });
      if(p) baixarComprovanteParticipantePDF(p, this);
    });
  });

  if(state.unlocked){
    list.querySelectorAll('.bl-icon-edit[data-edit-id]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.editingPartId = this.dataset.editId;
        state.editPartErr = '';
        renderPartList();
      });
    });

    var cancelBtn = list.querySelector('[data-cancel-edit]');
    if(cancelBtn){
      cancelBtn.addEventListener('click', function(){
        state.editingPartId = null;
        state.editPartErr = '';
        renderPartList();
      });
    }

    var saveBtn = list.querySelector('[data-save-id]');
    if(saveBtn){
      saveBtn.addEventListener('click', function(){
        var id = this.dataset.saveId;
        var p = state.participants.find(function(x){ return x.id === id; });
        if(!p) return;
        var novoNome = document.getElementById('blEditNome').value.trim();
        var novasCotasRaw = document.getElementById('blEditCotas').value;
        var novasCotas = parseInt(novasCotasRaw, 10);
        if(!novoNome){
          state.editPartErr = 'Informe o nome do participante.';
          renderPartList();
          return;
        }
        if(!novasCotas || novasCotas < 1){
          state.editPartErr = 'Informe uma quantidade v\u00e1lida de cotas (m\u00ednimo 1).';
          renderPartList();
          return;
        }
        var duplicado = state.participants.some(function(x){ return x.id !== id && x.nome.toLowerCase() === novoNome.toLowerCase(); });
        if(duplicado){
          state.editPartErr = 'J\u00e1 existe um participante com esse nome.';
          renderPartList();
          return;
        }
        var oldNome = p.nome;
        if(oldNome !== novoNome){
          var oldN = normName(oldNome), jogosChanged = false;
          state.jogos.forEach(function(j){ if(j.palpiteDe && normName(j.palpiteDe) === oldN){ j.palpiteDe = novoNome; jogosChanged = true; } });
          if(normName(palpiteNomeAtual) === oldN){ palpiteNomeAtual = novoNome; }
          if(jogosChanged){ saveJogos().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); }); }
        }
        p.nome = novoNome;
        p.cotas = novasCotas;
        state.editingPartId = null;
        state.editPartErr = '';
        updateHeader();
        renderParticipantes();
        saveParticipants().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
      });
    }

    list.querySelectorAll('.bl-icon-del[data-id]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = this.dataset.id;
        state.participants = state.participants.filter(function(p){ return p.id !== id; });
        updateHeader();
        renderParticipantes();
        saveParticipants().catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
      });
    });
  }
}

function applyPalette(c){
  PALETTE_VARS.forEach(function(v){
    if(c && /^#[0-9a-fA-F]{6}$/.test(c[v[0]] || '')){ document.documentElement.style.setProperty(v[2], c[v[0]]); }
    else { document.documentElement.style.removeProperty(v[2]); }
  });
}
function paletteLum(hex){
  var ch = [1,3,5].map(function(i){
    var v = parseInt(hex.substr(i,2),16) / 255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*ch[0] + 0.7152*ch[1] + 0.0722*ch[2];
}
function paletteContrast(a, b){
  var la = paletteLum(a), lb = paletteLum(b);
  return (Math.max(la,lb) + 0.05) / (Math.min(la,lb) + 0.05);
}

      if(applyLockoutUI()) return;

      okBtn.disabled = true;

          var lo = registerFailedPinAttempt();

        }
      });
    }
  });

var outros = {
  pool: new Set(), gameSize: 9, numGames: 10, maxCommon: 13,
  pf: { seq:false, miolo:false, primos:false, mult3:false, rowcol:false },
  repOn: false, repMin: 2, repMax: 3,
  bets: [], checked: [], msg: '', msgOk: false
};

function outrosStats(){
  if(state.gerador.stats) return state.gerador.stats;
  var ord = officialDraws.slice().sort(function(a,b){ return a.data < b.data ? 1 : (a.data > b.data ? -1 : b.concurso - a.concurso); })
    .slice(0,30).map(function(d){ return d.dezenas; });
  return ord.length ? computeStats(ord) : null;
}
function commonWithSet(arr, set){
  var c = 0;
  for(var i=0;i<arr.length;i++){ if(set.has(arr[i])) c++; }
  return c;
}
// Gera jogos de K dezenas a partir do grupo, garantindo que nenhum par (no lote ou contra os
// jogos já salvos) tenha mais dezenas em comum que o limite, e respeitando os padrões marcados.
function outrosGenerate(){
  var o = outros, K = o.gameSize, lim = o.maxCommon;
  var pool = Array.from(o.pool).sort(function(a,b){ return a-b; });
  if(pool.length < K) return { err: 'O grupo precisa ter pelo menos ' + K + ' dezenas para gerar jogos de ' + K + '.' };
  var anyPf = Object.keys(o.pf).some(function(k){ return o.pf[k]; });
  var stats = anyPf ? outrosStats() : null;
  if(anyPf && !stats) return { err: 'Não há histórico de sorteios para calcular os padrões. Desmarque os padrões ou aguarde o carregamento dos concursos.' };
  var lastD = null, lastSetO = null;
  if(o.repOn){
    lastD = ultimoConcursoOficial();
    if(!lastD) return { err: 'N\u00e3o h\u00e1 concurso oficial cadastrado para aplicar a repeti\u00e7\u00e3o do \u00faltimo concurso.' };
    lastSetO = new Set(lastD.dezenas);
  }
  var tol = { seq:1, miolo:1, primos:1, mult3:1, rowcol:1 };
  var refSets = state.jogos.map(function(j){ return { set: new Set(j.numeros), len: j.numeros.length }; });
  var batchSets = [], bets = [], counts = {};
  pool.forEach(function(n){ counts[n] = 0; });
  var attempts = 0, maxAttempts = 30000;
  while(bets.length < o.numGames && attempts < maxAttempts){
    attempts++;
    var noise = 1 + attempts / 400;
    var cand = pool.slice().sort(function(a,b){ return (counts[a] + Math.random()*noise) - (counts[b] + Math.random()*noise); }).slice(0,K).sort(function(a,b){ return a-b; });
    var ok = true, i;
    for(i=0;i<refSets.length && ok;i++){
      var c1 = commonWithSet(cand, refSets[i].set);
      if(c1 > lim || (c1 === K && refSets[i].len === K)) ok = false;
    }
    for(i=0;i<batchSets.length && ok;i++){
      var c2 = commonWithSet(cand, batchSets[i]);
      if(c2 > lim || c2 === K) ok = false;
    }
    if(!ok) continue;
    if(lastSetO){
      var repN = commonWithSet(cand, lastSetO);
      if(repN < o.repMin || repN > o.repMax) continue;
    }
    if(anyPf && !checkPatterns(cand, stats, o.pf, tol)) continue;
    bets.push(cand);
    batchSets.push(new Set(cand));
    cand.forEach(function(n){ counts[n]++; });
  }
  return { bets: bets, attempts: attempts, savedCount: refSets.length };
}

function otRenderPool(){
  var c = document.getElementById('otPoolGrid');
  if(!c) return;
  c.innerHTML = '';
  for(var n=1;n<=MAX_NUM;n++){
    var b = document.createElement('div');
    b.className = 'pn-ball selectable' + (outros.pool.has(n) ? ' in-pool' : '');
    b.textContent = String(n).padStart(2,'0');
    b.addEventListener('click', (function(num){ return function(){
      if(outros.pool.has(num)) outros.pool.delete(num); else outros.pool.add(num);
      otRenderPool();
    }; })(n));
    c.appendChild(b);
  }
  var ct = document.getElementById('otPoolCount');
  if(ct) ct.textContent = outros.pool.size + ' dezena(s) no grupo. Escolha entre ' + BET_MIN + ' e ' + MAX_NUM + '.';
}

function renderOutros(){
  var body = document.getElementById('blBody');
  var o = outros;
  if(!state.unlocked){
    body.innerHTML = '<div class="bl-panel"><h3>Outros jogos \u00b7 \u00c1rea do organizador</h3><p class="bl-hint">Esta aba \u00e9 restrita ao organizador. Desbloqueie o acesso de organizador para usar o gerador de jogos extras.</p></div>';
    return;
  }
  var html = '<div class="bl-panel"><h3>Outros jogos \u00b7 \u00c1rea do organizador</h3>';
  html += '<p class="bl-hint">Escolha quais n\u00fameros (de 06 a 60, dentre as 60 dezenas da Mega-Sena) podem participar dos jogos extras. A partir desse grupo, s\u00e3o gerados jogos de 6 a 15 dezenas, comparando cada jogo novo com os demais do mesmo lote e com todos os jogos j\u00e1 salvos em Nossos jogos, garantindo que nenhum par repita mais do que o limite de dezenas em comum definido abaixo (padr\u00e3o: 13). Voc\u00ea tamb\u00e9m pode escolher quais padr\u00f5es hist\u00f3ricos cada jogo deve respeitar, com as faixas ajustadas proporcionalmente ao tamanho do jogo.</p>';
  html += '<div class="bl-row" style="margin-bottom:8px;"><button class="bl-btn" id="otAll" type="button">Marcar as 60</button><button class="bl-btn" id="otClear" type="button" style="background:transparent;color:var(--magenta-dark);border:1px solid var(--line);">Limpar</button></div>';
  html += '<div class="pn-ball-grid" id="otPoolGrid"></div><p class="bl-hint" id="otPoolCount"></p></div>';

  html += '<div class="bl-panel"><h3>Par\u00e2metros</h3><div class="bl-row" style="gap:12px;align-items:flex-end;">';
  html += '<div class="bl-field"><label class="bl-hint">Dezenas por jogo</label><select class="bl-input" id="otSize">';
  for(var k=BET_MIN;k<=BET_MAX;k++){ html += '<option value="'+k+'"'+(k===o.gameSize?' selected':'')+'>'+k+'</option>'; }
  html += '</select></div>';
  html += '<div class="bl-field"><label class="bl-hint">Quantidade de jogos</label><input class="bl-input" type="number" id="otNum" min="1" max="200" value="'+o.numGames+'" style="width:100px;" /></div>';
  html += '<div class="bl-field"><label class="bl-hint">M\u00e1x. de dezenas em comum</label><input class="bl-input" type="number" id="otLim" min="0" max="14" value="'+o.maxCommon+'" style="width:100px;" /></div>';
  html += '</div><p class="bl-hint">Compara com os ' + state.jogos.length + ' jogo(s) j\u00e1 salvos em Nossos jogos e com os demais jogos do lote.</p></div>';

  html += '<div class="bl-panel"><h3>Padr\u00f5es hist\u00f3ricos</h3>';
  [['seq','Sequ\u00eancias de n\u00fameros consecutivos'],['miolo','Miolo da grade'],['primos','N\u00fameros primos'],['mult3','M\u00faltiplos de 3'],['rowcol','Linhas e colunas da grade']].forEach(function(pt){
    html += '<label class="bl-check-toggle" style="display:flex;margin:4px 0;"><input type="checkbox" class="otPf" data-k="'+pt[0]+'" '+(o.pf[pt[0]]?'checked':'')+' /> '+pt[1]+'</label>';
  });
  html += '<div class="bl-row" style="border-top:1px dashed var(--line);padding-top:12px;margin-top:8px;align-items:center;"><label class="bl-check-toggle"><input type="checkbox" id="otRepOn" '+(o.repOn?'checked':'')+' /> S\u00f3 gerar jogos com repeti\u00e7\u00e3o do \u00faltimo concurso entre</label><input class="bl-input" type="number" id="otRepMin" min="0" max="6" value="'+o.repMin+'" style="width:56px;flex:none;" /><span class="bl-hint" style="margin:0;">e</span><input class="bl-input" type="number" id="otRepMax" min="0" max="6" value="'+o.repMax+'" style="width:56px;flex:none;" /></div>';
  var lastO = ultimoConcursoOficial();
  html += '<p class="bl-hint">' + (lastO ? '\u00daltimo concurso oficial cadastrado: <strong>' + lastO.concurso + '</strong> (' + lastO.data.split('-').reverse().join('/') + '), dezenas ' + lastO.dezenas.map(function(n){ return String(n).padStart(2,'0'); }).join(', ') + '.' : 'Nenhum concurso oficial cadastrado ainda.') + '</p>';
  html += '<p class="bl-hint">Faixas calculadas pela m\u00e9dia dos \u00faltimos concursos \u00b1 toler\u00e2ncia, escaladas pelo tamanho do jogo.</p>';
  html += '<button class="bl-btn" id="otGen" type="button">Gerar jogos</button>';
  if(o.msg){ html += '<div class="bl-note" style="margin-top:10px;'+(o.msgOk?'background:var(--sel-bg);border-color:var(--sel-line);color:var(--sel-text);':'')+'">'+escapeHtml(o.msg)+'</div>'; }
  html += '</div>';

  if(o.bets.length){
    var allC = o.checked.every(function(c){ return c; });
    html += '<div class="bl-panel"><h3>Jogos gerados</h3><label class="bl-check-toggle"><input type="checkbox" id="otSelAll" '+(allC?'checked':'')+' /> Marcar todos ('+o.bets.length+')</label>';
    o.bets.forEach(function(bet,i){
      var sum = bet.reduce(function(a,n){ return a+n; },0);
      html += '<div class="bl-row" style="border-bottom:1px solid var(--line);padding:6px 0;"><label class="bl-check-toggle"><input type="checkbox" class="otChk" data-i="'+i+'" '+(o.checked[i]?'checked':'')+' /></label><span class="bl-num" style="color:var(--muted);width:26px;">'+(i+1)+'</span><span class="bl-mini-balls">'+bet.map(function(n){ return '<span class="bl-mini-ball">'+String(n).padStart(2,'0')+'</span>'; }).join('')+'</span><span class="bl-hint" style="margin-left:auto;">soma '+sum+'</span></div>';
    });
    var cnt = o.checked.filter(function(c){ return c; }).length;
    html += '<div class="bl-row" style="margin-top:10px;"><button class="bl-btn" id="otSend" type="button" '+(cnt?'':'disabled')+'>Enviar '+cnt+' jogo'+(cnt===1?'':'s')+' para Nossos jogos</button><button class="bl-btn" id="otClearBets" type="button" style="background:transparent;color:var(--magenta-dark);border:1px solid var(--line);">Limpar jogos gerados</button></div></div>';
  }
  body.innerHTML = html;
  otRenderPool();

  function readInputs(){
    o.gameSize = parseInt(document.getElementById('otSize').value,10) || 9;
    o.numGames = Math.max(1, Math.min(200, parseInt(document.getElementById('otNum').value,10) || 10));
    var lim = parseInt(document.getElementById('otLim').value,10);
    o.maxCommon = isNaN(lim) ? 13 : Math.max(0, Math.min(14, lim));
    document.querySelectorAll('.otPf').forEach(function(cb){ o.pf[cb.dataset.k] = cb.checked; });
    o.repOn = document.getElementById('otRepOn').checked;
    var rmin = parseInt(document.getElementById('otRepMin').value,10), rmax = parseInt(document.getElementById('otRepMax').value,10);
    o.repMin = isNaN(rmin) ? 0 : Math.max(0, Math.min(6, rmin));
    o.repMax = isNaN(rmax) ? 6 : Math.max(0, Math.min(6, rmax));
    if(o.repMin > o.repMax){ var tr = o.repMin; o.repMin = o.repMax; o.repMax = tr; }
  }
  document.getElementById('otAll').addEventListener('click', function(){ for(var n=1;n<=MAX_NUM;n++) o.pool.add(n); otRenderPool(); });
  document.getElementById('otClear').addEventListener('click', function(){ o.pool.clear(); otRenderPool(); });
  document.getElementById('otGen').addEventListener('click', function(){
    readInputs();
    var r = outrosGenerate();
    if(r.err){ o.msg = r.err; o.msgOk = false; o.bets = []; o.checked = []; }
    else {
      o.bets = r.bets; o.checked = r.bets.map(function(){ return true; });
      o.msgOk = r.bets.length > 0;
      o.msg = r.bets.length >= o.numGames
        ? r.bets.length + ' jogo(s) gerado(s), todos com no máximo ' + o.maxCommon + ' dezena(s) em comum entre si e com os ' + r.savedCount + ' jogo(s) salvos.'
        : 'Só foi possível gerar ' + r.bets.length + ' de ' + o.numGames + ' jogo(s) com essas regras. Amplie o grupo, aumente o limite de dezenas em comum ou desmarque algum padrão.';
    }
    renderOutros();
  });
  var selAll = document.getElementById('otSelAll');
  if(selAll) selAll.addEventListener('change', function(){ var v = this.checked; o.checked = o.bets.map(function(){ return v; }); renderOutros(); });
  document.querySelectorAll('.otChk').forEach(function(cb){
    cb.addEventListener('change', function(){ o.checked[parseInt(this.dataset.i,10)] = this.checked; readInputs(); renderOutros(); });
  });
  var clearBets = document.getElementById('otClearBets');
  if(clearBets) clearBets.addEventListener('click', function(){ o.bets = []; o.checked = []; o.msg = ''; o.msgOk = false; renderOutros(); });
  var sendBtn = document.getElementById('otSend');
  if(sendBtn) sendBtn.addEventListener('click', function(){
    var chosen = o.bets.filter(function(b,i){ return o.checked[i]; });
    if(!chosen.length) return;
    previewOrigem = 'Outros jogos';
    previewGames = buildPreview(chosen);
    switchToTab('jogos');
  });
}

function renderTabBody(){
  if(state.tab === 'gerador') renderGerador();
  else if(state.tab === 'jogos') renderJogos();
  else if(state.tab === 'palpites') renderPalpites();
  else if(state.tab === 'outros') renderOutros();
  else renderParticipantes();
}

function switchToTab(tabName){
  document.querySelectorAll('.bl-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.tab === tabName); });
  state.tab = tabName;
  renderTabBody();
  renderNotice();
  if(tabName === 'gerador') autoCheckGeradorHistory();
}

// Busca o concurso mais recente automaticamente sempre que a aba "Gerador de
// jogos" \u00e9 aberta \u2014 n\u00e3o h\u00e1 mais bot\u00e3o manual para isso. Roda em segundo
// plano: se n\u00e3o houver concurso novo ou a consulta falhar (instabilidade/
// bloqueio de rede), a tela permanece como estava, sem erro vis\u00edvel.
function autoCheckGeradorHistory(){
  var msgEl = document.getElementById('gnCheckLatestMsg');
  if(msgEl) msgEl.textContent = 'Verificando concurso mais recente...';
  fetchLatestConcursoOficial().then(function(draw){
    if(!draw){
      if(msgEl) msgEl.textContent = '';
      return;
    }
    var isNew = addOfficialDraw(draw);
    window.storage.set('officialLastAutoCheck', new Date().toISOString().slice(0,10), true).catch(function(){});
    if(isNew){
      renderGerador();
      var newMsgEl = document.getElementById('gnCheckLatestMsg');
      if(newMsgEl) newMsgEl.textContent = 'Concurso ' + draw.concurso + ' (' + fmtDateTime(draw.data) + ') adicionado automaticamente aos dados oficiais.';
    } else if(msgEl){
      msgEl.textContent = '';
    }
  }).catch(function(){
    if(msgEl) msgEl.textContent = '';
  });
}

function syncLockbarSpacer(){
  var bar = document.getElementById('blLockbar');
  var spacer = document.getElementById('blLockbarSpacer');
  if(bar && spacer){ spacer.style.height = bar.offsetHeight + 'px'; }
  if(bar){ document.documentElement.style.setProperty('--lockbar-h', bar.offsetHeight + 'px'); }
}

function render(){
  updateHeader();
  renderTabBody();
  renderNotice();
  syncLockbarSpacer();
}

document.querySelectorAll('.bl-tab').forEach(function(tab){
  tab.addEventListener('click', function(){
    switchToTab(this.dataset.tab);
  });
});

function applyAppTitle(){
  var eyebrowEl = document.getElementById('blEyebrow');
  var titleEl = document.getElementById('blTitle');
  if(eyebrowEl) eyebrowEl.textContent = state.appTitle.eyebrow;
  if(titleEl) titleEl.textContent = state.appTitle.title;
}

function renderEditTitleForm(){
  var wrap = document.getElementById('blEditTitleForm');
  if(!wrap) return;
  if(!state.unlocked || !state.appTitleEditing){
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    return;
  }
  wrap.style.display = 'block';
  var html = '<div class="bl-field"><label>Categoria (texto pequeno acima)</label><input class="bl-input" id="blEyebrowInput" value="' + escapeHtml(state.appTitle.eyebrow) + '" maxlength="40" /></div>';
  html += '<div class="bl-field"><label>Nome do bol\u00e3o</label><input class="bl-input" id="blTitleInput" value="' + escapeHtml(state.appTitle.title) + '" maxlength="60" /></div>';
  if(state.appTitleErr){ html += '<div class="bl-error">' + escapeHtml(state.appTitleErr) + '</div>'; }
  html += '<div class="bl-row"><button class="bl-btn" id="blTitleSaveBtn" type="button">Salvar</button><button class="bl-btn secondary" id="blTitleCancelBtn" type="button">Cancelar</button></div>';
  wrap.innerHTML = html;

  document.getElementById('blTitleSaveBtn').addEventListener('click', function(){
    var eyebrowVal = document.getElementById('blEyebrowInput').value.trim();
    var titleVal = document.getElementById('blTitleInput').value.trim();
    if(!eyebrowVal || !titleVal){
      state.appTitleErr = 'Preencha os dois campos.';
      renderEditTitleForm();
      return;
    }
    state.appTitleErr = '';
    state.appTitle = { eyebrow: eyebrowVal, title: titleVal };
    state.appTitleEditing = false;
    applyAppTitle();
    renderEditTitleForm();
    window.storage.set('appTitle', JSON.stringify(state.appTitle), true).catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
  });
  document.getElementById('blTitleCancelBtn').addEventListener('click', function(){
    state.appTitleEditing = false;
    state.appTitleErr = '';
    renderEditTitleForm();
  });
}

document.getElementById('blEditTitleBtn').addEventListener('click', function(){
  state.appTitleEditing = !state.appTitleEditing;
  state.appTitleErr = '';
  renderEditTitleForm();
});

document.getElementById('blLockBtn').addEventListener('click', function(){
  if(state.unlocked){
    state.unlocked = false;
    state.appTitleEditing = false;
    updateHeader();
    renderEditTitleForm();
    renderTabBody();
    window.storage.delete('organizerSession', false).catch(function(e){ console.error('Erro ao salvar no Firestore:', e); });
    return;
  }
  if(state.organizerPinHash){
    renderLockModal('enter');
  } else {
    renderLockModal('create');
  }
});

document.getElementById('blPaletteBtn').addEventListener('click', renderPaletteModal);

document.getElementById('blChangePinBtn').addEventListener('click', function(){
  renderLockModal('change');
});

loadData();
window.addEventListener('resize', syncLockbarSpacer);
})();
</script>

</body>
</html>
